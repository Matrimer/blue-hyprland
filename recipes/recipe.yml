# image will be published to ghcr.io/<user>/<name>
name: blue-hyprland
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/hyprland-nvidia
#base-image: ghcr.io/ublue-os/silverblue-main # default
#base-image: ghcr.io/ublue-os/silverblue-nvidia 
image-version: latest # latest is also supported if you want new updates ASAP

# Compile some source based programs, like sent
# stages:
#   - name: gamescope
#     from: 

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: rpm-ostree
    install:
      - hyprutils
      - hyprland-protocols-devel
      # Launcher
      #- wofi # default is rofi-wayland
      # Necessary nice-to have
      - gnome-software
      # - plasma-discover
      # - plasma-discover-flatpak
      # For bauh
      - aria2 # multi-threaded downloads
      # - libappindicator-gtk3 # For tray-mode
      # - axel # multi-threaded downloads alternative
      # - sqlite3 # Appimage support
      # - python3-beautifulsoup4 # Web applications support
      # To run bauh natively
      # - python3-lxml # Web application support
      # General dependencies
      # - python3-yamlloader
      # - python3-dateutil
      # - python3-pyqt5-sip
      # - python3-packaging
      # - python3-requests

      
      - gparted
      # - gum # useful for scripts. Not in repos.

      # Terminal emulator
      - foot
      - foot-terminfo

      # Other nice-to-have that make things work:
      - gamescope # wayland mini-compositor for games
      - mangohud

      # Drivers for gaming
      # Included allready: mesa-vulkan-drivers vulkan-tools vulkan-loader vulkan-validation-layers
      # Not included, seems to cause problems if installed.
      #- pipewire-plugin-vulkan
      #- vulkan-headers 

      # Android
      #- waydroid is installed through script
      - lzip # needed for waydroid script. Maybe better to install in a temporary container
      # Also needs python3, which is allready available.

      # Editors (testing)
      - helix
      # - micro
      # - emacs
      # - neovim
      # - joe
      

      # File-browsers

      # Email-clients? homebrew
      # - aerc
      # - alpine
      
      # Instant messaging
      # - finch # homebrew
      
      # News, RSS, blogs
      
      
      # File-sharing

      # Music players
      #- mpd
      #- mpc
     
      # Powersaving 
      - powertop # not in homebrew
      # - tlp

      # included allready
      #- hyprland
      #- xdg-desktop-portal-hyprland
      #- waybar
      #- brightnessctl
      # default suggestions
      # - starship
    remove:
      # example: removing firefox (in favor of the flatpak)
      # "firefox" is the main package, "firefox-langpacks" is a dependency
      - firefox
      - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
      # - power-profiles-daemon
      # - gnome-disk-utility
  - type: default-flatpaks
    notify: true # Send notification after install/uninstall is finished (true/false)
    system:
      # If no repo information is specified, Flathub will be used by default
      # repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      # repo-name: flathub
      # repo-title: "Flathub (system-wide)" # Optional; this sets the remote's user-facing name in graphical frontends like GNOME Software
      install:
        - org.mozilla.firefox
        # - Flatseal: com.github.tchx84.Flatseal
        #- com.github.d4nj1.tlpui
        # - org.gnome.Loupe
        # - one.ablaze.floorp//lightning # This is an example of flatpak which has multiple branches in selection (flatpak//branch).
      # Flatpak runtimes are not supported (like org.winehq.Wine//stable-23.08),
      # only normal flatpak applications are (like Floorp Lightning web browser in this example).
      # Installing different branches of the same Flatpak is not supported.
  #     remove:
  #     # - org.gnome.eog
  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-update: true # brew binary
    update-interval: 1d
    auto-upgrade: true # brew packages
    upgrade-interval: 1d
  
  # - type: chezmoi
  #   repository:
  #   branch:
  #   all-users: false
  #   disable-update: true
   
  - type: justfiles
    validate: false

#  - type: yafti
# Doesn't seem to launch properly.
# Has loads of python dependencies.
# It's otherwise nice, but I might make my own instead.

       
  - type: script
    snippets:
      - "systemctl enable setcaps.service"
  #   #   - "setcap 'CAP_SYS_NICE=eip' /usr/bin/gamescope"
  #   scripts:
  #     - setcaps.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

